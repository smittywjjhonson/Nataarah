<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Core Service Process Cards - Transparent & Visible Arrows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 2400px;
      height: 570px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .process-cards-track {
      width: 2400px;
      height: 570px;
      position: relative;
      background: transparent;
      padding: 35px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* CARDS */
    .stage-card {
      width: 520px;
      height: 496px;
      background: #ffffff;
      border: 1.8px solid #dce8d3;
      border-radius: 24px;
      padding: 26px 30px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 36px -6px rgba(18, 59, 50, 0.07), 0 2px 10px rgba(18, 59, 50, 0.02);
      position: relative;
      z-index: 2;
    }
    .stage-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stage-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 15px;
      border-radius: 999px;
      background: #eef5e7;
      border: 1.2px solid #d2e4c8;
      color: #123B32;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'Manrope', sans-serif;
    }
    .stage-num {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #8C9870;
      letter-spacing: -0.02em;
    }

    /* ILLUSTRATION CONTAINER */
    .illustration-frame {
      width: 100%;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .illustration-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* CARD FOOTER */
    .stage-card-foot {
      text-align: center;
      padding-top: 16px;
      border-top: 1.5px solid #edf4e7;
    }
    .stage-title {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #123B32;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .stage-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #6e875e;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* PROMINENT VISIBLE CONNECTOR ARROWS BETWEEN CARDS */
    .arrow-connector {
      width: 80px;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    /* Dashed guide line behind the arrow badge */
    .connector-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(90deg, #b8d3ab 0px, #b8d3ab 6px, transparent 6px, transparent 12px);
      z-index: 1;
    }
    .arrow-badge {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #8C9870;
      box-shadow: 0 4px 16px rgba(18, 59, 50, 0.14), 0 1px 4px rgba(18, 59, 50, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #123B32;
      position: relative;
      z-index: 2;
    }
    .arrow-badge svg {
      width: 22px;
      height: 22px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="process-cards-track">
    <!-- CARD 01: Business Discovery -->
    <article class="stage-card">
      <div class="stage-card-head">
        <span class="stage-tag">Tahap 01</span>

                   C130,140 148,110 159,105

                   C220,68 235,46 253,42"

          <path d="M65,158 L85,158 L92,145 L98,166 L104,136 L112,142 
                   C130,140 148,110 159,105 
                   C175,98 190,75 206,72 
                   C220,68 235,46 253,42" 
                fill="none" stroke="#8C9870" stroke-width="7" stroke-opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
